name: macOS 14 Compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app bundle
        run: ./scripts/build-app.sh
